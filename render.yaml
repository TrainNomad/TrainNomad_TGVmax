services:
  - type: web
    name: trainnomad-tgvmax-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Ne rebuild que si le code change : les données arrivent par la Release GitHub (rechargement à chaud),
    # pas par un commit. Modifier le README ou build_network.py ne déclenche donc aucun build.
    buildFilter:
      paths:
        - "*.go"
        - go.mod
        - Dockerfile
        - render.yaml
    envVars:
      # Réseau téléchargé au démarrage (repli : network.bin.gz de l'image), puis à chaque POST /reload.
      - key: NETWORK_URL
        value: https://github.com/TrainNomad/TrainNomad_TGVmax/releases/download/network-latest/network.bin.gz
      # Active POST /reload, appelé par la GitHub Action après chaque publication. Même valeur que le secret
      # GitHub RELOAD_TOKEN. Sans lui, le réseau n'est rechargé qu'au redémarrage (réveil) de l'instance.
      - key: RELOAD_TOKEN
        sync: false
