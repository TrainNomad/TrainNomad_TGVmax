name: Mise à jour quotidienne du réseau TGVmax

# SNCF Open Data -> GTFS -> network.bin.gz -> tests Go -> Release GitHub « network-latest ».
# L'API sur Render recharge le réseau à chaud depuis la Release : aucun build Render, aucun commit.
on:
  schedule:
    # Tous les jours à 5h15 UTC (le jeu de données SNCF est rafraîchi dans la nuit)
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tgvmax
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Télécharger les données TGVmax et les convertir en GTFS
      run: python sncf_to_gtfs.py --refresh

    - name: Compiler le réseau (network.bin.gz)
      run: python build_network.py

    - name: Configurer Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    # Le réseau n'est publié que si le moteur Go le charge et y trouve des trajets cohérents.
    - name: Vérifier le réseau avec le moteur Go
      run: |
        go vet ./...
        go test -v ./...

    - name: Archiver le GTFS produit
      uses: actions/upload-artifact@v4
      with:
        name: tgvmax-gtfs
        path: |
          tgvmax_gtfs.zip
          build_report.json
        retention-days: 7

    # URL fixe lue par l'API : https://github.com/<dépôt>/releases/download/network-latest/network.bin.gz
    - name: Publier le réseau dans la Release network-latest
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG=network-latest
        NOTES="Réseau TGVmax compilé le $(date -u +%Y-%m-%dT%H:%M:%SZ) (run ${{ github.run_id }}). Mis à jour automatiquement chaque jour : ne pas supprimer."
        if ! gh release view "$TAG" >/dev/null 2>&1; then
          gh release create "$TAG" --title "Réseau TGVmax (dernière version)" --notes "$NOTES" --latest=false
        fi
        gh release upload "$TAG" network.bin.gz build_report.json --clobber
        gh release edit "$TAG" --notes "$NOTES"

    # Facultatif : sans ces secrets, l'API vérifie d'elle-même toutes les heures (et à chaque réveil).
    - name: Demander à l'API de recharger le réseau
      env:
        API_URL: ${{ secrets.TGVMAX_API_URL }}
        RELOAD_TOKEN: ${{ secrets.RELOAD_TOKEN }}
      run: |
        if [ -z "$API_URL" ] || [ -z "$RELOAD_TOKEN" ]; then
          echo "Secrets TGVMAX_API_URL / RELOAD_TOKEN absents : l'API se mettra à jour seule."
          exit 0
        fi
        # Une instance gratuite endormie met jusqu'à ~1 min à se réveiller.
        curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 120 -X POST -H "Authorization: Bearer $RELOAD_TOKEN" "${API_URL%/}/reload"
