name: Mise à jour quotidienne du réseau TGVmax

# SNCF Open Data -> GTFS -> network.bin.gz -> tests Go -> commit (Render redéploie automatiquement).
on:
  schedule:
    # Tous les jours à 5h15 UTC (le jeu de données SNCF est rafraîchi dans la nuit)
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tgvmax
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Télécharger les données TGVmax et les convertir en GTFS
      run: python sncf_to_gtfs.py --refresh

    - name: Compiler le réseau (network.bin.gz)
      run: python build_network.py

    - name: Configurer Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    # Le réseau n'est publié que si le moteur Go le charge et y trouve des trajets cohérents.
    - name: Vérifier le réseau avec le moteur Go
      run: |
        go vet ./...
        go test -v ./...

    - name: Archiver le GTFS produit
      uses: actions/upload-artifact@v4
      with:
        name: tgvmax-gtfs
        path: |
          tgvmax_gtfs.zip
          build_report.json
        retention-days: 7

    - name: Commit et push (Render redéploie automatiquement)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add network.bin.gz build_report.json
        git commit -m "Auto-update: réseau TGVmax du $(date -u +%Y-%m-%d)" || exit 0
        git push
