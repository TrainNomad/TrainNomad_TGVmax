name: Create TGVmax Release

on:
  schedule:
    # Chaque jour à 3h UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reload:
        description: 'Recharger les données sur Render après la mise à jour'
        required: false
        default: 'true'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download TGVmax data from SNCF
        run: |
          mkdir -p data
          go run ./cmd -output data/data.bin.gz
        working-directory: Backend/tgvmax
        env:
          GOPROXY: direct

      - name: Check file size
        run: |
          ls -lh Backend/tgvmax/data/data.bin.gz
          du -sh Backend/tgvmax/data/data.bin.gz

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-tgvmax
          name: TGVmax Data (Latest)
          files: Backend/tgvmax/data/data.bin.gz
          draft: false
          prerelease: false
          body: |
            # TGVmax Data Update

            **Generated**: ${{ github.event.head_commit.timestamp || github.run_id }}

            Données TGVmax compilées pour chargement rapide en RAM.

            ## Usage
            1. Télécharger `data.bin.gz` depuis cette release
            2. Placer dans le répertoire `Backend/tgvmax/data/`
            3. Redémarrer le service ou appeler `POST /api/tgvmax/reload`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reload data on Render
        if: github.event.inputs.reload == 'true' || github.event_name == 'schedule'
        run: |
          set -e
          RENDER_URL="${{ secrets.RENDER_TGVMAX_URL }}"
          RELOAD_SECRET="${{ secrets.RELOAD_SECRET }}"

          if [ -z "$RENDER_URL" ]; then
            echo "⚠️  RENDER_TGVMAX_URL not set, skipping reload"
            exit 0
          fi

          echo "Reloading data on $RENDER_URL"
          curl -X POST \
            -H "X-Reload-Secret: $RELOAD_SECRET" \
            -H "Content-Type: application/json" \
            "$RENDER_URL/api/tgvmax/reload"

          echo "✓ Reload triggered"

  verify-release:
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Download release asset
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          repo: ${{ github.repository }}
          version: latest-tgvmax
          file: data.bin.gz
          target: data.bin.gz

      - name: Verify file integrity
        run: |
          if [ -f data.bin.gz ]; then
            ls -lh data.bin.gz
            file data.bin.gz
            echo "✓ File verified"
          else
            echo "❌ File not found"
            exit 1
          fi
